services:

  # ===================== MySQL（生产级优化） =====================
  mysql:
    image: mysql:8.0.32
    container_name: mysql-agent
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_db}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - my-network

  # ===================== phpMyAdmin =====================
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: phpmyadmin-agent
    restart: always
    profiles:
      - admin
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8899}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - my-network

  # ===================== Redis（AOF + 安全优化） =====================
  redis:
    image: redis:7.0-alpine
    container_name: redis-agent
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===================== Redis 管理工具 =====================
  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: redis-agent-admin
    restart: always
    profiles:
      - admin
    ports:
      - "127.0.0.1:${REDIS_ADMIN_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: ${REDIS_ADMIN_USER:?REDIS_ADMIN_USER is required}
      HTTP_PASSWORD: ${REDIS_ADMIN_PASSWORD:?REDIS_ADMIN_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - my-network

  # ===================== pgvector（AI向量数据库） =====================
  vector_db:
    image: pgvector/pgvector:pg16
    container_name: vector-db-agent
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-springai}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./pgvector/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - my-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: legal-object-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - my-network

  # ===================== pgAdmin =====================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vector-db-admin-agent
    restart: always
    profiles:
      - admin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    depends_on:
      - vector_db
    networks:
      - my-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-agent
    restart: always
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
# ===================== 数据卷（持久化核心） =====================
volumes:
  mysql_data:
  redis_data:
  pgvector_data:
  minio_data:

# ===================== 网络隔离 =====================
networks:
  my-network:
    driver: bridge
